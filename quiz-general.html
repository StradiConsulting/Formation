<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Quiz Hygiene - Stradi Consulting</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;font-family:Arial,sans-serif;background:#f4f6f8;color:#1a1a1a}
.wrapper{width:100%;max-width:680px;margin:0 auto;padding:1rem 0.75rem 2rem}
.header{display:flex;flex-direction:column;align-items:center;margin-bottom:0.75rem}
.header img{width:80px;margin-bottom:0.4rem}
.divider{width:60px;height:3px;background:linear-gradient(to right,#6b8f71,#5a7a8a,#c0503a);border-radius:2px;margin:0.3rem auto 0.6rem}
h1{font-size:1.05rem;font-weight:700;text-align:center;color:#1a4f7a;margin-bottom:0.2rem}
.subtitle{font-size:0.78rem;color:#666;text-align:center;margin-bottom:1rem}
.card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:1rem}
input[type=text]{width:100%;padding:0.75rem 1rem;border:1.5px solid #dce3e8;border-radius:9px;font-size:1rem;margin-bottom:0.75rem;outline:none}
input[type=text]:focus{border-color:#1a4f7a}
.btn-start{background:#1a4f7a;color:#fff;border:none;border-radius:9px;padding:0.8rem;font-size:1rem;font-weight:700;cursor:pointer;width:100%}
.progress-bar{width:100%;height:5px;background:#dce3e8;border-radius:3px;margin-bottom:1rem}
.progress-fill{height:100%;background:#1a4f7a;border-radius:3px;transition:width 0.4s}
.qnum{font-size:11px;color:#999;margin-bottom:0.3rem}
.qtext{font-size:0.97rem;font-weight:700;line-height:1.5;margin-bottom:1rem}
.options{display:flex;flex-direction:column;gap:8px}
.opt{background:#f4f6f8;border:1.5px solid #dce3e8;border-radius:9px;padding:0.75rem 0.9rem;font-size:0.92rem;cursor:pointer;text-align:left;width:100%}
.opt.correct{background:#d4edda;border-color:#3B6D11;color:#1e4d08;font-weight:700}
.opt.wrong{background:#f8d7da;border-color:#E24B4A;color:#7a1c1c}
.feedback{margin-top:0.75rem;padding:0.75rem;border-radius:9px;font-size:0.83rem;line-height:1.6}
.feedback.ok{background:#d4edda;color:#1e4d08;border-left:4px solid #3B6D11}
.feedback.ko{background:#f8d7da;color:#7a1c1c;border-left:4px solid #E24B4A}
.btn-next{background:#1a4f7a;color:#fff;border:none;border-radius:9px;padding:0.8rem;font-size:0.92rem;font-weight:700;cursor:pointer;width:100%;margin-top:0.9rem}
.score-card{text-align:center;padding:1rem 0.5rem}
.score-big{font-size:2.8rem;font-weight:900;color:#1a4f7a}
.score-label{font-size:0.95rem;color:#555;margin-bottom:0.75rem}
.score-msg{font-size:0.88rem;color:#333;line-height:1.7;margin-bottom:1rem;background:#f4f6f8;padding:0.9rem;border-radius:9px;text-align:left}
.hidden-notice{background:#fff3cd;border:1px solid #ffc107;border-radius:9px;padding:0.9rem;color:#856404;font-size:0.88rem;margin-bottom:0.75rem}
.status-bar{background:#e8f0e8;border-radius:9px;padding:0.5rem 0.75rem;font-size:0.78rem;color:#3a6b3a;text-align:center;margin-top:0.5rem}
.nom-display{font-size:0.8rem;color:#1a4f7a;text-align:center;margin-bottom:0.5rem;font-weight:700}
.footer{margin-top:1rem;font-size:0.72rem;color:#bbb;text-align:center}
</style>
</head>

aire lors des controles officiels."}, {"q": "Si un salarie presente des vomissements ou diarrhees :", "opts": ["Travailler normalement", "Manipuler seulement les desserts", "Signaler immediatement sa situation au responsable", "Porter deux gants"], "ans": 2, "exp": "Salarie malade : signaler et etre ecarte de toute manipulation alimentaire immediatement."}, {"q": "Dans les 5M, Main d oeuvre correspond :", "opts": ["Aux fournisseurs", "Au personnel et aux pratiques humaines", "Aux batiments", "Aux emballages"], "ans": 1, "exp": "Main d'oeuvre dans les 5M : personnel et pratiques humaines, formation, hygiene, comportements."}];
var nom = "", current = 0, score = 0, answered = false;
var sessionId = "s" + Date.now().toString(36) + Math.random().toString(36).substr(2,4);

function init() {
  document.getElementById("main-area").innerHTML =
    "<div class='qtext' style='margin-bottom:0.75rem'>Bienvenue ! Saisissez votre nom pour commencer.</div>" +
    "<input type='text' id='nom-input' placeholder='Votre prenom et nom' maxlength='60'/>" +
    "<button class='btn-start' onclick='startQuiz()'>Commencer le quiz</button>";
  document.getElementById("prog").style.width = "0%";
}

function startQuiz() {
  var v = document.getElementById("nom-input").value.trim();
  if (!v) { alert("Merci de saisir votre nom."); return; }
  nom = v;
  current = 0; score = 0;
  document.getElementById("nom-bar").innerHTML = "<div class='nom-display'>" + nom + "</div>";
  saveData("en_cours", 0);
  renderQ();
}

function saveData(statut, scoreVal) {
  if (!nom) return;
  db.ref("resultats/" + sessionId).set({
    nom: nom,
    score: scoreVal,
    total: questions.length,
    pct: Math.round(scoreVal / questions.length * 100),
    statut: statut,
    heure: new Date().toLocaleTimeString("fr-FR"),
    question_en_cours: current + 1
  });
}

function renderQ() {
  answered = false;
  var q = questions[current];
  document.getElementById("prog").style.width = ((current/questions.length)*100) + "%";
  var opts = "";
  for (var i = 0; i < q.opts.length; i++) {
    opts += "<button class='opt' onclick='choose(" + i + ")'>" + q.opts[i] + "</button>";
  }
  document.getElementById("main-area").innerHTML =
    "<div class='qnum'>Question " + (current+1) + " / " + questions.length + "</div>" +
    "<div class='qtext'>" + q.q + "</div>" +
    "<div class='options'>" + opts + "</div>" +
    "<div id='fb'></div>" +
    "<button class='btn-next' id='btn-next' style='display:none' onclick='nextQ()'>" +
    (current < questions.length-1 ? "Question suivante" : "Voir mes resultats") + "</button>";
}

function choose(i) {
  if (answered) return;
  answered = true;
  var q = questions[current];
  var btns = document.querySelectorAll(".opt");
  for (var b = 0; b < btns.length; b++) {
    btns[b].disabled = true;
    if (b === q.ans) btns[b].classList.add("correct");
    else if (b === i && i !== q.ans) btns[b].classList.add("wrong");
  }
  if (i === q.ans) score++;
  document.getElementById("fb").innerHTML =
    "<div class='feedback " + (i===q.ans?"ok":"ko") + "'>" + (i===q.ans?"Bonne reponse - ":"Mauvaise reponse - ") + q.exp + "</div>";
  document.getElementById("btn-next").style.display = "block";
  saveData("en_cours", score);
}

function nextQ() {
  current++;
  if (current >= questions.length) showScore();
  else renderQ();
}

function showScore() {
  document.getElementById("prog").style.width = "100%";
  var pct = Math.round((score/questions.length)*100);
  var mention = pct>=80?"Tres bien":pct>=60?"Bien":pct>=50?"Passable":"Insuffisant";
  var msg = pct>=80?"Excellente maitrise !":pct>=60?"Bonne base, quelques points a approfondir.":pct>=50?"Niveau suffisant, continuez a progresser.":"Des lacunes importantes, la formation va vous aider.";
  saveData("termine", score);
  db.ref("config/hidden").once("value").then(function(snap){
    var hidden = snap.val() === true;
    var scoreHtml = hidden
      ? "<div class='hidden-notice'>Resultats masques par le formateur.</div>"
      : "<div class='score-big'>" + score + "/" + questions.length + "</div><div class='score-label'>" + pct + "% - " + mention + "</div>";
    document.getElementById("main-area").innerHTML =
      "<div class='score-card'><div style='font-size:1.1rem;font-weight:700;color:#1a4f7a;margin-bottom:0.75rem'>" + nom + "</div>" +
      scoreHtml + "<div class='score-msg'>" + msg + "</div>" +
      "<div class='status-bar'>Resultat transmis au formateur.</div></div>";
  });
}

init();
</script>
