<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz – Températures en restauration collective</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; font-family: Arial, sans-serif; background: #f4f6f8; color: #1a1a1a; }
    .wrapper { width: 100%; max-width: 680px; margin: 0 auto; padding: 1rem 0.75rem 1.5rem; }
    .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 0.75rem; }
    .header img { width: 90px; margin-bottom: 0.5rem; }
    h1 { font-size: 1.1rem; font-weight: 700; text-align: center; color: #1a4f7a; margin-bottom: 0.2rem; line-height: 1.4; }
    .subtitle { font-size: 0.8rem; color: #666; text-align: center; margin-bottom: 1rem; }
    .progress-bar { width: 100%; height: 5px; background: #dce3e8; border-radius: 3px; margin-bottom: 1rem; }
    .progress-fill { height: 100%; background: #1a4f7a; border-radius: 3px; transition: width 0.4s ease; }
    .card { background: #fff; border-radius: 12px; padding: 1rem; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; margin-bottom: 0.5rem; }
    .tag-chaud { background: #FAEEDA; color: #854F0B; }
    .tag-froid { background: #dbeeff; color: #185FA5; }
    .tag-reception { background: #e8f0e8; color: #3a6b3a; }
    .question-num { font-size: 11px; color: #999; margin-bottom: 0.3rem; }
    .question-text { font-size: 0.97rem; font-weight: 700; line-height: 1.5; margin-bottom: 1rem; color: #1a1a1a; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .option-btn { background: #f4f6f8; border: 1.5px solid #dce3e8; border-radius: 9px; padding: 0.75rem 0.9rem; font-size: 0.92rem; color: #1a1a1a; cursor: pointer; text-align: left; width: 100%; -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s; }
    .option-btn:active:not(:disabled) { background: #e0eaf5; border-color: #1a4f7a; }
    .option-btn.correct { background: #d4edda; border-color: #3B6D11; color: #1e4d08; font-weight: 700; }
    .option-btn.wrong { background: #f8d7da; border-color: #E24B4A; color: #7a1c1c; }
    .feedback { margin-top: 0.75rem; padding: 0.75rem 0.9rem; border-radius: 9px; font-size: 0.85rem; line-height: 1.6; }
    .feedback.ok { background: #d4edda; color: #1e4d08; border-left: 4px solid #3B6D11; }
    .feedback.ko { background: #f8d7da; color: #7a1c1c; border-left: 4px solid #E24B4A; }
    .nav-row { margin-top: 0.9rem; }
    .btn-next { background: #1a4f7a; color: #fff; border: none; border-radius: 9px; padding: 0.8rem 1.5rem; font-size: 0.92rem; font-weight: 700; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
    .btn-next:active { background: #0f3558; }
    .score-card { text-align: center; padding: 0.75rem 0.5rem; }
    .score-big { font-size: 3rem; font-weight: 900; color: #1a4f7a; }
    .score-label { font-size: 0.95rem; color: #555; margin-bottom: 0.75rem; }
    .score-msg { font-size: 0.88rem; color: #333; line-height: 1.7; margin-bottom: 1.25rem; background: #f4f6f8; padding: 0.9rem; border-radius: 9px; text-align: left; }
    .btn-restart { background: #1a4f7a; color: #fff; border: none; border-radius: 9px; padding: 0.8rem 2rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; }
    .footer { margin-top: 1rem; font-size: 0.72rem; color: #bbb; text-align: center; }
    .divider { width: 60px; height: 3px; background: linear-gradient(to right, #6b8f71, #5a7a8a, #c0503a); border-radius: 2px; margin: 0.4rem auto 0.75rem; }
  </style>

    q:"Lors d'un refroidissement rapide, quelle est la durée maximale autorisée pour passer de +63 °C à +10 °C ?",
    opts:["1 heure","2 heures","3 heures","4 heures"], ans:1,
    exp:"La règle des 2 heures : le refroidissement doit permettre de passer de +63 °C à +10 °C en moins de 2 heures, en cellule de refroidissement rapide. C'est une obligation réglementaire." },
  { tagLabel:"Liaison froide", tagClass:"tag-froid",
    q:"Quelle est la température maximale de conservation des plats en liaison froide (plats cuisinés réfrigérés) ?",
    opts:["+ 4 °C","+ 6 °C","+ 8 °C","+ 3 °C"], ans:3,
    exp:"Selon les bonnes pratiques d'hygiène (BPH) appliquées en restauration collective, les plats cuisinés en liaison froide doivent être conservés à une température ≤ +3 °C jusqu'au moment de la remise en température." },
  { tagLabel:"Liaison chaude", tagClass:"tag-chaud",
    q:"Lors de la remise en température, quelle température à cœur doit être atteinte et en quel délai maximum ?",
    opts:["+63 °C en 1 heure","+75 °C en 2 heures","+80 °C en 1 heure","+63 °C en 30 minutes"], ans:0,
    exp:"La remise en température doit porter le plat à ≥ +63 °C à cœur, en moins d'1 heure. Cette température doit être maintenue jusqu'au service." },
  { tagLabel:"Contrôle réception", tagClass:"tag-reception",
    q:"À quelle température maximale les viandes fraîches doivent-elles être réceptionnées, selon les bonnes pratiques d'hygiène (BPH) ?",
    opts:["+ 4 °C","+ 7 °C","+ 3 °C","+ 5 °C"], ans:2,
    exp:"Selon les bonnes pratiques d'hygiène (BPH) appliquées en restauration collective, les viandes fraîches doivent être réceptionnées à une température ≤ +3 °C." },
  { tagLabel:"Contrôle réception", tagClass:"tag-reception",
    q:"Quelle est la température maximale de réception des poissons frais ?",
    opts:["+ 2 °C","+ 3 °C","0 °C (proche de la glace fondante)","+ 4 °C"], ans:2,
    exp:"Les poissons frais doivent être maintenus à une température proche de 0 °C (glace fondante), soit environ 0 à +2 °C. Une réception au-delà indique une rupture de la chaîne du froid." },
  { tagLabel:"Liaison froide", tagClass:"tag-froid",
    q:"Quelle est la durée de vie maximale (DLC) d'un plat cuisiné en liaison froide après fabrication, sans étude de vieillissement ?",
    opts:["24 heures","48 heures","3 jours","5 jours"], ans:2,
    exp:"Sans étude de vieillissement spécifique, la durée de vie d'un plat cuisiné en liaison froide est de 3 jours maximum (J+3, jour de fabrication compris). Une étude de vieillissement validée peut permettre d'étendre cette durée." },
  { tagLabel:"Liaison froide", tagClass:"tag-froid",
    q:"En liaison froide, à quelle température maximale doivent être conservés les produits de charcuterie tranchés ?",
    opts:["+ 4 °C","+ 6 °C","+ 3 °C","+ 8 °C"], ans:2,
    exp:"Selon les bonnes pratiques d'hygiène (BPH), les produits de charcuterie tranchés doivent être conservés à une température ≤ +3 °C. Ce seuil plus exigeant tient compte de la vulnérabilité de ces produits prêts à consommer." },
  { tagLabel:"Contrôle réception", tagClass:"tag-reception",
    q:"Lors des réceptions de marchandises, à quelle fréquence les températures doivent-elles être contrôlées et enregistrées ?",
    opts:["Une fois par semaine","À chaque réception de marchandises","Une fois par jour","Une fois par mois"], ans:1,
    exp:"La traçabilité impose un contrôle et un enregistrement des températures à chaque réception de marchandises. Ces enregistrements doivent être conservés et disponibles lors des contrôles officiels (HACCP)." },
  { tagLabel:"Liaison froide", tagClass:"tag-froid",
    q:"Un plat cuisiné chaud qui a été refroidi puis remis en température peut-il être refroidi une seconde fois pour être consommé ultérieurement ?",
    opts:["Oui, si la chaîne du froid est respectée","Oui, si consommé dans les 24 h","Non, jamais","Oui, avec accord du responsable"], ans:2,
    exp:"Un plat ayant subi un cycle chaud→froid→chaud ne peut jamais être refroidi à nouveau. La double remontée en température multiplie les risques de développement bactérien. Le plat doit impérativement être consommé ou détruit." }
];

let current = 0, score = 0, answered = false;

function renderQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("prog").style.width = ((current / questions.length) * 100) + "%";
  document.getElementById("quiz-area").innerHTML = `
    <span class="tag ${q.tagClass}">${q.tagLabel}</span>
    <div class="question-num">Question ${current + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
    <div class="options">${q.opts.map((o,i) => `<button class="option-btn" onclick="choose(${i})">${o}</button>`).join("")}</div>
    <div id="feedback"></div>
    <div class="nav-row"><button class="btn-next" id="btn-next" style="display:none" onclick="next()">${current < questions.length-1 ? "Question suivante →" : "Voir les résultats →"}</button></div>
  `;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll(".option-btn").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.ans) b.classList.add("correct");
    else if (idx === i && i !== q.ans) b.classList.add("wrong");
  });
  if (i === q.ans) score++;
  const ok = i === q.ans;
  document.getElementById("feedback").innerHTML = `<div class="feedback ${ok?"ok":"ko"}">${ok ? "✓ Bonne réponse — " : "✗ Mauvaise réponse — "}${q.exp}</div>`;
  document.getElementById("btn-next").style.display = "block";
}

function next() {
  current++;
  if (current >= questions.length) showScore();
  else renderQuestion();
}

function showScore() {
  document.getElementById("prog").style.width = "100%";
  const pct = Math.round((score / questions.length) * 100);
  const msg = pct >= 80
    ? "Excellente maîtrise ! Vous connaissez les règles fondamentales du contrôle des températures en restauration collective."
    : pct >= 50
    ? "Bonne base de connaissances. Quelques points méritent d'être revus, notamment sur les durées réglementaires."
    : "Des révisions s'imposent. Reprenez en particulier les températures et durées clés de la liaison chaude, froide et de la remise en température.";
  document.getElementById("quiz-area").innerHTML = `
    <div class="score-card">
      <div class="score-big">${score}/${questions.length}</div>
      <div class="score-label">${pct} % de bonnes réponses</div>
      <div class="score-msg">${msg}</div>
      <button class="btn-restart" onclick="restart()">Recommencer le quiz</button>
    </div>
  `;
}

function restart() { current = 0; score = 0; renderQuestion(); }
renderQuestion();
</script>

</html>
