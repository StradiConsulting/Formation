<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Formateur - Stradi Consulting</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;font-family:Arial,sans-serif;background:#1a1a2e;color:#eee}
.wrapper{max-width:1000px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;border-bottom:2px solid #1a4f7a;padding-bottom:1rem}
.header img{width:55px}
.header h1{font-size:1.15rem;color:#7eb8e8;flex:1}
.live{font-size:0.72rem;color:#4caf50;border:1px solid #4caf50;padding:3px 8px;border-radius:99px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;margin-bottom:1.25rem}
.stat-card{background:#16213e;border-radius:10px;padding:0.9rem;text-align:center;border:1px solid #1a4f7a}
.stat-num{font-size:1.9rem;font-weight:900;color:#7eb8e8}
.stat-label{font-size:0.72rem;color:#aaa;margin-top:0.2rem}
.controls{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:1.25rem}
.btn{padding:0.55rem 1rem;border:none;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer}
.btn-danger{background:#c0503a;color:#fff}
.btn-warning{background:#e0a020;color:#1a1a1a}
.btn-success{background:#3a7a3a;color:#fff}
.btn-resultats{background:linear-gradient(135deg,#1a4f7a,#7eb8e8);color:#fff;font-size:0.9rem;padding:0.65rem 1.25rem}
.btn-print{background:#444;color:#fff}
.btn-second{background:#6a3a8a;color:#fff;font-size:0.72rem;padding:3px 7px;border:none;border-radius:5px;cursor:pointer;margin-left:3px}
.btn-del{background:none;border:none;cursor:pointer;color:#c0503a;font-size:0.95rem;padding:2px 5px;border-radius:4px;vertical-align:middle}
.btn-del:hover{background:#2a0a0a}
table{width:100%;border-collapse:collapse}
th{background:#1a4f7a;padding:0.7rem 0.75rem;font-size:0.8rem;text-align:left;color:#fff}
td{padding:0.6rem 0.75rem;font-size:0.83rem;border-bottom:1px solid #0f3d5a;color:#ddd;vertical-align:middle}
tr:hover td{background:#0d2d47}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:0.72rem;font-weight:700}
.badge-tb{background:#1e4d08;color:#a8e6a0}
.badge-b{background:#1a4f1a;color:#c8f0c8}
.badge-p{background:#4d3d08;color:#f5d070}
.badge-i{background:#4d0808;color:#f5a0a0}
.badge-ec{background:#0d2d47;color:#7eb8e8;border:1px solid #1a4f7a}
.no-data{text-align:center;padding:2rem;color:#555;font-style:italic}
.second-banner{background:#2a1a3a;border:1px solid #6a3a8a;border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.83rem;color:#c8a0e8}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);z-index:10000;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.overlay.on{display:flex}
.attn{font-size:1.4rem;font-weight:700;color:#ffd700;text-shadow:0 0 30px #ffd700;margin-bottom:1.5rem;letter-spacing:2px;animation:glow 1s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #ffd700;}to{text-shadow:0 0 50px #ffd700,0 0 100px #ff8800;}}
.cdown{font-size:11rem;font-weight:900;color:#fff;text-shadow:0 0 60px #7eb8e8;line-height:1}
.cdown.pop{animation:popfx 0.3s ease}
@keyframes popfx{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.bravo{font-size:2.2rem;font-weight:900;color:#ffd700;padding:2rem;display:none;text-shadow:0 0 30px #ffd700;line-height:1.7;animation:glow 1s infinite alternate}
canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:10001}
@media print{
  body{background:#fff;color:#000}
  .controls,.live,.overlay,canvas,.btn-del,.btn-second,.second-banner{display:none!important}
  th{background:#1a4f7a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{color:#000;border-bottom:1px solid #ddd}
}
</style>
</head>

var firebaseConfig = { databaseURL: "https://stradi-quiz-default-rtdb.europe-west1.firebasedatabase.app" };
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var masked = false;
var allKeys = {};

// stocke les cles Firebase par index
function setKey(idx, key) { allKeys[idx] = key; }
function getKey(idx) { return allKeys[idx]; }

db.ref("resultats").on("value", function(snap) {
  allKeys = {};
  var data = snap.val();
  if (!data) {
    document.getElementById("tbl").innerHTML = "<div class='no-data'>Aucun stagiaire pour le moment.</div>";
    document.getElementById("second-banner").innerHTML = "";
    updateStats([]);
    return;
  }
  var list = [];
  var keys = Object.keys(data);
  for (var i = 0; i < keys.length; i++) {
    var r = data[keys[i]];
    if (r && r.nom) { r._key = keys[i]; list.push(r); }
  }
  list.sort(function(a,b){
    if (a.statut==="termine" && b.statut!=="termine") return -1;
    if (a.statut!=="termine" && b.statut==="termine") return 1;
    return (a.nom||"").localeCompare(b.nom||"");
  });
  // stocker les cles par index
  for (var j=0; j<list.length; j++) { allKeys[j] = list[j]._key; }
  updateStats(list);
  renderTable(list);
  renderBanner(list);
});

function renderTable(list) {
  if (list.length === 0) {
    document.getElementById("tbl").innerHTML = "<div class='no-data'>Aucun stagiaire.</div>";
    return;
  }
  var rows = "";
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var ec = r.statut === "en_cours";
    var echec = !ec && (r.pct||0) < 50;
    var badge = ec
      ? "<span class='badge badge-ec'>Q"+(r.question_en_cours||1)+"/40</span>"
      : (r.pct||0)>=80 ? "<span class='badge badge-tb'>Tres bien</span>"
      : (r.pct||0)>=60 ? "<span class='badge badge-b'>Bien</span>"
      : (r.pct||0)>=50 ? "<span class='badge badge-p'>Passable</span>"
      : "<span class='badge badge-i'>Insuffisant</span>";
    // boutons sans apostrophes dans onclick - on utilise data-idx
    var actions = "<button class='btn-del' data-idx='"+i+"' title='Supprimer'>&#x1F5D1;</button>";
    if (echec) {
      actions += "<button class='btn-second' data-idx='"+i+"'>2eme chance</button>";
    }
    rows += "<tr>"
      +"<td>"+(i+1)+"</td>"
      +"<td><strong>"+(r.nom||"-")+"</strong></td>"
      +"<td>"+(ec?"-":(r.score||0)+"/40")+"</td>"
      +"<td>"+(ec?"-":(r.pct||0)+"%")+"</td>"
      +"<td>"+badge+"</td>"
      +"<td>"+(r.heure||"-")+"</td>"
      +"<td>"+actions+"</td>"
      +"</tr>";
  }
  document.getElementById("tbl").innerHTML =
    "<table><thead><tr><th>#</th><th>Nom</th><th>Score</th><th>%</th><th>Statut</th><th>Heure</th><th></th></tr></thead><tbody>"+rows+"</tbody></table>";

  // attacher les evenements apres rendu
  var delBtns = document.querySelectorAll(".btn-del");
  for (var d=0; d<delBtns.length; d++) {
    delBtns[d].addEventListener("click", function(){
      var idx = parseInt(this.getAttribute("data-idx"));
      var key = getKey(idx);
      if (key && confirm("Supprimer cette entree ?")) {
        db.ref("resultats/" + key).remove();
      }
    });
  }
  var secBtns = document.querySelectorAll(".btn-second");
  for (var s=0; s<secBtns.length; s++) {
    secBtns[s].addEventListener("click", function(){
      var idx = parseInt(this.getAttribute("data-idx"));
      var key = getKey(idx);
      if (key && confirm("Autoriser ce stagiaire a refaire le quiz ?")) {
        db.ref("resultats/" + key).remove();
      }
    });
  }
}

function renderBanner(list) {
  var echecs = list.filter(function(r){ return r.statut==="termine" && (r.pct||0)<50; });
  var banner = document.getElementById("second-banner");
  if (echecs.length === 0) { banner.innerHTML = ""; return; }
  var noms = echecs.map(function(r){return r.nom;}).join(", ");
  banner.innerHTML = "<div class='second-banner'>&#9888; <strong>"+echecs.length+" stagiaire(s) sous la moyenne :</strong> "+noms+" — Utilisez le bouton <strong>2eme chance</strong> pour leur permettre de refaire le quiz.</div>";
}

function updateStats(list) {
  var t = list.filter(function(r){return r.statut==="termine";});
  var e = list.filter(function(r){return r.statut==="en_cours";});
  var m = t.length>0?Math.round(t.reduce(function(a,r){return a+(r.pct||0);},0)/t.length):null;
  document.getElementById("s-total").textContent = list.length;
  document.getElementById("s-encours").textContent = e.length;
  document.getElementById("s-termines").textContent = t.length;
  document.getElementById("s-moy").textContent = m!==null?m+"%":"-";
}

document.getElementById("btn-raz").onclick = function() {
  if (!confirm("Remettre a zero tous les resultats ?")) return;
  db.ref("resultats").remove();
  db.ref("config/hidden").set(false);
};

document.getElementById("btn-mask").onclick = function() {
  masked = !masked;
  db.ref("config/hidden").set(masked);
};

db.ref("config/hidden").on("value", function(snap){
  masked = snap.val() === true;
  document.getElementById("btn-mask").textContent = masked ? "Afficher les resultats" : "Masquer les resultats";
  document.getElementById("btn-mask").className = masked ? "btn btn-success" : "btn btn-warning";
});

document.getElementById("btn-print").onclick = function() { window.print(); };

document.getElementById("btn-feu").onclick = function() {
  var overlay = document.getElementById("overlay");
  var cnum = document.getElementById("cnum");
  var attn = document.getElementById("attn");
  var bravo = document.getElementById("bravo");
  overlay.classList.add("on");
  attn.style.display = "block";
  bravo.style.display = "none";
  cnum.style.display = "block";
  cnum.textContent = "10";
  var n = 10;
  var iv = setInterval(function() {
    n--;
    cnum.classList.remove("pop");
    void cnum.offsetWidth;
    cnum.classList.add("pop");
    if (n > 0) {
      cnum.textContent = n;
    } else {
      clearInterval(iv);
      cnum.style.display = "none";
      attn.style.display = "none";
      startFW();
      db.ref("resultats").once("value").then(function(snap){
        var data = snap.val();
        var list = data ? Object.values(data).filter(function(r){return r&&r.statut==="termine";}) : [];
        var allOk = list.length>0 && list.every(function(r){return (r.pct||0)>=50;});
        bravo.innerHTML = allOk
          ? "BRAVO !<br>Tous les stagiaires ont valide la formation !<br>Felicitations a toute la promotion !"
          : "Merci a tous pour votre participation !<br>Continuez a progresser !";
        bravo.style.display = "block";
        setTimeout(function(){
          stopFW();
          overlay.classList.remove("on");
          cnum.style.display = "block";
          attn.style.display = "block";
          cnum.textContent = "10";
        }, 10000);
      });
    }
  }, 1000);
  overlay.onclick = function(e){
    if (e.target===overlay){ clearInterval(iv); stopFW(); overlay.classList.remove("on"); cnum.textContent="10"; }
  };
};

// FIREWORKS
var canvas=document.getElementById("fc"), ctx=canvas.getContext("2d"), parts=[], fwr=false;
function rsz(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",rsz);rsz();
function rc(){return "hsl("+Math.floor(Math.random()*360)+","+(70+Math.floor(Math.random()*30))+"%,"+(50+Math.floor(Math.random()*30))+"%)"; }
function burst(){
  var x=Math.random()*canvas.width, y=50+Math.random()*canvas.height*0.65;
  for(var i=0;i<150;i++){var a=Math.PI*2/150*i,s=3+Math.random()*10;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:1,c:rc(),sz:1.5+Math.random()*3.5});}
  for(var j=0;j<40;j++){parts.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,alpha:1,c:"#fff",sz:1+Math.random()*2});}
}
function afw(){
  ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fillRect(0,0,canvas.width,canvas.height);
  for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.055;p.vx*=0.98;p.alpha-=0.011;ctx.globalAlpha=Math.max(0,p.alpha);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;parts=parts.filter(function(p){return p.alpha>0;});
  if(fwr)requestAnimationFrame(afw);
}
function startFW(){fwr=true;ctx.clearRect(0,0,canvas.width,canvas.height);burst();burst();burst();afw();canvas._bi=setInterval(function(){if(fwr){burst();if(Math.random()>0.4)burst();}},280);}
function stopFW(){fwr=false;clearInterval(canvas._bi);ctx.clearRect(0,0,canvas.width,canvas.height);parts=[];}
</script>
</body>
</html>
